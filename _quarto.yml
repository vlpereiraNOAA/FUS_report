project: 
  type: website

website: 
  page-navigation: true
  title: "NOAA quarto simple" 
  site-url: "https://vlpereiraNOAA.github.io/FUS_report/" 
  repo-url: "https://github.com/vlpereiraNOAA/FUS_report/"
  repo-actions: [edit, source, issue]
  favicon: images/favicon.ico
  
  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-1.0"
  
  sidebar:
    background: "#D9E3E4"
    logo: "https://upload.wikimedia.org/wikipedia/commons/7/79/NOAA_logo.svg"
    favicon: images/favicon.ico
    pinned: true
    align: center
    tools: 
      - icon: globe
        href: https://nmfs-ost.github.io
        text: "NMFS Office of Science and Technology"
      - icon: github
        href: https://github.com/vlpereiraNOAA/FUS_report
        text: "NMFS OST FUS report"

    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Home
      - section: content/Commercial Fisheries.qmd
        contents: 
          - href: content/Commercial1.qmd
            text: Commercial1
      - section: content/Recreational Fisheries.qmd
        text: "Recreational Fisheries"
      - section: content/Processed Products.qmd
        text: "Processed products"
      - section: content/Aquaculture.qmd
        text: "Aquaculture"
      - section: content/ForeignTrade.qmd
        text: "Foreign Trade"
      - section: content/Percapitaconsumption.qmd
        text: "Per Capita Consumption"
      - href: content/Reporting.qmd
        text: Reporting
      - section: "Optional Pages"
        contents: 
          - content/SharedValues.qmd
          - content/Onboarding.qmd
          - content/Offboarding.qmd
          - content/FieldMethods.qmd
          - content/OpenScience.qmd
          - content/PublicationsPresentations.qmd
          - content/Resources.qmd

        
format:
  html:
    theme:
      light: [cosmo, theme.scss] 
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    toc: true


filters:
  - include-files.lua
  - quarto

  
